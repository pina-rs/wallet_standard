name: "ci"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint all
        run: lint:all
        shell: devenv shell -c -- bash -e {0}

  security:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: audit Rust dependencies
        run: security:audit
        shell: devenv shell -c -- bash -e {0}

      - name: check dependency policy
        run: security:deny
        shell: devenv shell -c -- bash -e {0}

      - name: audit GitHub Actions workflows
        run: security:zizmor
        shell: devenv shell -c -- bash -e {0}

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: test `wallet_standard`
        run: cargo test_wallet_standard
        shell: devenv shell -c -- bash -e {0}

  coverage:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: coverage `wallet_standard`
        run: cargo coverage_wallet_standard
        shell: devenv shell -c -- bash -e {0}

      - name: coverage `codecov_report`
        run: cargo coverage_codecov_report
        shell: devenv shell -c -- bash -e {0}

      - name: upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: codecov.json
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        run: cargo build --locked
        shell: devenv shell -c -- bash -e {0}

      - name: build all features
        run: build:all
        shell: devenv shell -c -- bash -e {0}

  # `build:all` compiles the workspace with `--all-features`, which hides
  # feature-graph gaps: the `solana` feature of `wallet_standard_browser`
  # shipped without `dep:solana-transaction` because the all-features build
  # enabled it implicitly. Every feature combination a downstream user can
  # name is checked on its own, for both the native and wasm targets.
  check-features:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: check every feature combination
        run: |
          cargo check --locked -p wallet_standard --no-default-features
          cargo check --locked -p wallet_standard --no-default-features --features solana
          cargo check --locked -p wallet_standard --no-default-features --features browser
          cargo check --locked -p wallet_standard --no-default-features --features browser,solana
          cargo check --locked -p wallet_standard_browser --no-default-features
          cargo check --locked -p wallet_standard_browser --features solana
          cargo check --locked -p wallet_standard_browser --features solana --target wasm32-unknown-unknown
        shell: devenv shell -c -- bash -e {0}

  # The browser bridge is only observable in a real browser: the wasm tests
  # cover wallet discovery, the connect flow, and the exact JavaScript shapes
  # that cross the wasm boundary (a regression there fails here instead of
  # silently in downstream dApps).
  test-browser:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The runner image ships Google Chrome but not a matching chromedriver;
      # `wasm-bindgen-test-runner` needs one on PATH.
      - name: install matching chromedriver
        run: |
          chrome_version="$(google-chrome --version | awk '{print $3}')"
          chrome_major="${chrome_version%%.*}"
          driver_version="$(
            curl -sSfL https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone.json \
              | jq -r --arg major "$chrome_major" '.milestones[$major].version'
          )"
          echo "chrome $chrome_version -> chromedriver $driver_version"
          curl -sSfL "https://storage.googleapis.com/chrome-for-testing-public/${driver_version}/linux64/chromedriver-linux64.zip" \
            -o /tmp/chromedriver.zip
          unzip -q /tmp/chromedriver.zip -d /tmp
          echo "/tmp/chromedriver-linux64" >> "$GITHUB_PATH"
          /tmp/chromedriver-linux64/chromedriver --version

      - name: test wallet_standard_browser in a browser
        # `LD_LIBRARY_PATH` from the devenv profile makes the system Chrome
        # load nix libraries and exit before the session opens; the wasm
        # build itself is pure Rust and does not need it.
        run: env -u LD_LIBRARY_PATH cargo test --locked --package wallet_standard_browser --all-features --target wasm32-unknown-unknown
        shell: devenv shell -c -- bash -e {0}

  # End-to-end: the Leptos and Dioxus examples embed a Rust Wallet Standard
  # wallet and drive it against a local surfpool node under Playwright. This
  # is the only layer that exercises the compiled dApp bundles in a real
  # browser, so it catches glue and bundling defects the wasm tests cannot.
  e2e:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-version: v2-e2e

      # `devenv shell` does not inherit the runner's node installation, and
      # the Playwright web servers need cargo, trunk, and wasm-bindgen from
      # the devenv profile alongside node — so expose the profile binaries on
      # PATH and run the suite in the default shell.
      - name: expose the devenv toolchain on PATH
        run: |
          profile="$(devenv shell -- bash -c 'printf %s "${DEVENV_PROFILE:-}" >&3' 3>&1 1>/dev/null)"
          if [[ -z "$profile" || ! -d "$profile/bin" ]]; then
            echo "devenv profile was not resolved to a bin directory: '$profile'" >&2
            exit 1
          fi
          echo "$profile/bin" >> "$GITHUB_PATH"
          # `cargo bin --install` places each crate under
          # `.bin/<toolchain>/<crate>/<version>/bin`; the `.shims` directory
          # only materialises inside a devenv shell, which the runner's node
          # is not part of.
          for bin_dir in "$PWD"/.bin/*/*/*/bin; do
            [[ -d "$bin_dir" ]] && echo "$bin_dir" >> "$GITHUB_PATH"
          done

      - name: install surfpool
        run: |
          curl -sSfL https://github.com/solana-foundation/surfpool/releases/latest/download/surfpool-linux-x64.tar.gz \
            -o /tmp/surfpool.tar.gz
          sudo tar -xzf /tmp/surfpool.tar.gz -C /usr/local/bin surfpool
          surfpool --version

      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('examples/e2e/package-lock.json') }}

      - name: install e2e dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: examples/e2e

      - name: run playwright suite
        run: npx playwright test
        working-directory: examples/e2e
        env:
          CI: "true"
