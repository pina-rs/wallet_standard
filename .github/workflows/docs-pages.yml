name: "docs-pages"

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "readme.md"
      - "devenv.nix"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build documentation
    if: github.repository_owner == 'pina-rs'
    permissions:
      contents: read # Read documentation and source files from the repository.
      pages: read # Read the GitHub Pages site configuration.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1 # v7
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure github pages
        uses: actions/configure-pages@v6.0.0 # v6

      - name: build documentation
        run: docs:build
        shell: devenv shell -c -- bash -e {0}

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0 # v5
        with:
          path: docs/book

  deploy:
    name: deploy documentation
    if: github.repository_owner == 'pina-rs'
    needs: build
    permissions:
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
      pages: write # Publish the built documentation artifact to GitHub Pages.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1 # v5
