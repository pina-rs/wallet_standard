# monostyle's configuration for this repository.
#
# The findings are reported inline on every pull request diff via the
# `--format github` output. A `fail-under` floor should be added at 90 once
# the findings it names are remediated.

fail-under = { readability = 90.0, complexity = 90.0 }

[rules]
max-line-width = 120

[rules.ignore]
# Generated output: changelogs written by monochange, code generated by
# codama or similar, and sample applications edited far less often than the
# packages they accompany.
patterns = [
  "CHANGELOG.md",
  "**/CHANGELOG.md",
  "**/*.g.dart",
  "**/*.freezed.dart",
  "**/*.pb.rs",
  "**/*.pb.go",
  "**/*.gen.ts",
  "**/*.min.js",
]
