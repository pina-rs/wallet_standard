[package]
name = "leptos-wallet"
version = "0.1.0"
edition = "2024"
publish = false
description = "Leptos 0.8 CSR dApp + embedded Wallet Standard dev wallet, demonstrated against a surfpool backend"

[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
surfpool-wallet-core = { path = "../crates/surfpool-wallet-core" }
wallet_standard = { path = "../../crates/wallet_standard", features = ["browser", "solana"] }
wallet_standard_browser = { path = "../../crates/wallet_standard_browser", features = ["solana"] }

solana-message = ">=4.2.3, <4.5.0"
solana-pubkey = ">=4.2.0, <4.3.0"

console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "z"
lto = true
