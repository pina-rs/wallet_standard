[package]
name = "surfpool-wallet-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Framework-agnostic Wallet Standard dev wallet + surfpool JSON-RPC client used by the browser examples"

[workspace]

[dependencies]
wallet_standard = { path = "../../../crates/wallet_standard", features = ["browser", "solana"] }
wallet_standard_browser = { path = "../../../crates/wallet_standard_browser", features = ["solana"] }

base64 = "0.22"
bincode = "1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-commitment-config = { version = "^3", features = ["serde"] }
solana-keypair = "3"
solana-message = ">=4.2.3, <4.5.0"
solana-pubkey = ">=4.2.0, <4.3.0"
solana-signature = { version = ">=3.4.1, <3.5.0", features = ["verify"] }
solana-signer = "^3"
solana-system-interface = { version = ">=3.2.0, <3.3.0", features = ["bincode"] }
solana-transaction = ">=4.1.4, <4.2.0"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Location", "Request", "RequestInit", "Response", "Window"] }
