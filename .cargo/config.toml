[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'
# `getrandom` 0.3+ requires an explicit backend on wasm32-unknown-unknown.
# The matching `wasm_js` crate features are enabled via target-specific
# dependencies in the crate manifests.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[alias]
dylint = ["bin", "cargo-dylint"]
llvm-cov = ["bin", "cargo-llvm-cov"]
nextest = ["bin", "cargo-nextest"]
semver-checks = ["bin", "cargo-semver-checks"]

test_wallet_standard = [
	"nextest",
	"run",
	"--package",
	"wallet_standard",
	"-F",
	"solana",
]

coverage_wallet_standard = [
	"llvm-cov",
	"--no-report",
	"--package",
	"wallet_standard",
	"-F",
	"solana",
]

coverage_codecov_report = [
	"llvm-cov",
	"report",
	"--doctests",
	"--codecov",
	"--output-path",
	"codecov.json",
]
