# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "cargo"
changelog = false

[changelog.sections]
breaking = { heading = "Breaking Changes", priority = 10 }
feat = { heading = "Features", priority = 20 }
fix = { heading = "Fixes", priority = 30 }
docs = { heading = "Documentation", priority = 40 }
other = { heading = "Notes", priority = 50 }

[changelog.types]
major = { bump = "major", section = "breaking" }
breaking = { bump = "major", section = "breaking" }
feat = { bump = "minor", section = "feat" }
fix = { bump = "patch", section = "fix" }
docs = { bump = "none", section = "docs" }
none = { bump = "none", section = "other" }

[source]
provider = "github"
owner = "pina-rs"
repo = "wallet_standard"

[source.releases]
enabled = true
source = "monochange"
branches = ["main"]
enforce_for_tags = true
enforce_for_publish = true
enforce_for_commit = false
changeset_context_timeout_seconds = 120

[source.pull_requests]
enabled = true
branch_prefix = "monochange/release"
base = "main"
title = "chore(release): prepare release"
labels = ["release", "automated"]
auto_merge = false

[cli.change]
help_text = "Create a changeset"
inputs = [
	{ name = "package", type = "string_list", required = true },
	{ name = "bump", type = "choice", choices = ["none", "patch", "minor", "major"], default = "patch" },
	{ name = "reason", type = "string", required = true },
	{ name = "type", type = "string" },
	{ name = "details", type = "string" },
	{ name = "caused_by", type = "string_list" },
	{ name = "output", type = "string" },
]
steps = [
	{ name = "create change file", type = "CreateChangeFile", inputs = ["package", "bump", "type", "caused_by", "reason", "details", "output"] },
]

[cli.release]
help_text = "Prepare, format, commit, and open the release pull request."
inputs = [
	{ name = "create_pr", help_text = "Whether to open or update the release pull request after creating the local release commit", type = "boolean", default = true },
]
steps = [
	{ name = "prepare release", type = "PrepareRelease", allow_empty_changesets = true, inputs = { format = "json" } },
	{ name = "format release commit", type = "Command", shell = "bash", command = "fix:format", when = "{{ number_of_changesets > 0 }}" },
	{ name = "commit release", type = "CommitRelease", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 }}" },
	{ name = "open release request", type = "OpenReleaseRequest", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 && inputs.create_pr }}" },
]

[package.wallet_standard]
path = "crates/wallet_standard"
type = "cargo"

[package.wallet_standard_browser]
path = "crates/wallet_standard_browser"
type = "cargo"

[group.core]
packages = ["wallet_standard", "wallet_standard_browser"]
release = true
tag = true
version_format = "primary"
changelog = { path = "changelog.md", format = "keep_a_changelog", include = "all" }
versioned_files = [
	{ path = "Cargo.toml", type = "cargo", fields = ["workspace.package.version"] },
]

[ecosystems.cargo]
enabled = true
versioned_files = ["Cargo.toml"]
# All workspace crates inherit `version = { workspace = true }`, so
# `cargo update --workspace` syncs exactly the released versions in the
# lockfile without touching dependency pins.
lockfile_commands = [
	{ command = "cargo update --workspace", cwd = ".", shell = "bash" },
]

[ecosystems.cargo.publish]
enabled = true
mode = "builtin"
trusted_publishing = { enabled = true, repository = "pina-rs/wallet_standard", workflow = "publish.yml", environment = "publisher" }

[ecosystems.cargo.publish_order]
dependency_fields = ["dependencies", "build-dependencies"]

# cargo-semver-checks produces proof-strength Rust compatibility evidence in
# place of the syntax-level `cargo/public-api` findings. Only
# `--detection-level semantic` runs the matrix; every other level ignores it.
[ecosystems.cargo.semver_checks]
enabled = true
timeout_seconds = 900

# Both crates expose their surface through features, so one cell is not enough:
# a break hidden behind `solana` or `browser` stays invisible to the default
# build. Every configured cell must complete before a clean result replaces the
# conservative syntax findings, so a cell that cannot run is worse than no cell
# at all: it forces `partial` coverage and review on every pull request.
#
# A `wasm32-unknown-unknown` cell is deliberately absent. cargo-semver-checks
# 0.50.0 cannot read target information from rustc 1.98.1 for that target
# ("output of --print=file-names missing"), so the cell fails before it checks
# anything. Add it once the tool supports the toolchain.
[[ecosystems.cargo.semver_checks.matrix]]
name = "default"
feature_mode = "default"

[[ecosystems.cargo.semver_checks.matrix]]
name = "all-features"
feature_mode = "all"

[changesets.affected]
enabled = true
required = true
skip_labels = ["release", "dependencies"]
comment_on_failure = true
ignored_paths = [
	"changelog.md",
	"docs/**",
	"license",
	"readme.md",
	"codecov.json",
]

[lints]
use = ["cargo/baseline"]

[lints.rules]
# Crates inherit `repository` from `[workspace.package]`; the per-crate
# subdirectory URL is a nice-to-have, not a correctness requirement.
"cargo/manifest-repository" = "off"
